<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean-Emmanuel Combe</title>
    <meta name="description" content="Il n’y a que le chemin qui est réel. — Only the path is real.">
    <meta name="author" content="Jean-Emmanuel Combe">
    <link rel="canonical" href="https://jean-emmanuel-combe.fr/">
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Jean-Emmanuel Combe — llms.txt">
    <link rel="me" href="https://hunkaar.fr">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0a0a0c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: #e8e4df;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 25% 45%, rgba(160, 130, 95, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 55%, rgba(100, 120, 140, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.015) 0%, transparent 70%);
            animation: breathe 14s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.06); }
        }

        canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        main.center {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem 2.5rem;
            max-width: 780px;
        }

        .line {
            width: 1px;
            height: 0;
            background: linear-gradient(to bottom, transparent, rgba(200, 180, 155, 0.35), transparent);
            margin: 0 auto 3rem;
            animation: growLine 2.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
        }

        @keyframes growLine {
            to { height: 65px; }
        }

        blockquote {
            font-size: clamp(1.65rem, 4.2vw, 2.9rem);
            font-weight: 300;
            font-style: italic;
            line-height: 1.55;
            letter-spacing: 0.025em;
            color: #e8e4df;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 2.6s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards;
        }

        blockquote.switching {
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(200, 180, 155, 0.4);
            margin: 3rem auto 0;
            opacity: 0;
            animation: fadeIn 2s ease 2.8s forwards;
        }

        .thread {
            position: fixed;
            bottom: 1.8rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 0.68rem;
            letter-spacing: 0.2em;
            opacity: 0;
            animation: fadeIn 2.2s ease 3.2s forwards;
        }

        .thread a {
            color: rgba(200, 180, 155, 0.36);
            text-decoration: none;
            transition: color 0.35s ease;
        }

        .thread a:hover {
            color: rgba(232, 228, 223, 0.78);
        }

        .lang-toggle {
            position: fixed;
            top: 2rem;
            right: 2.2rem;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            color: rgba(200, 180, 155, 0.3);
            opacity: 0;
            animation: fadeIn 2s ease 3s forwards;
            user-select: none;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: rgba(200, 180, 155, 0.38);
            font: inherit;
            letter-spacing: inherit;
            padding: 0.2rem 0.3rem;
            cursor: pointer;
            transition: color 0.35s ease;
        }

        .lang-toggle button:hover {
            color: rgba(232, 228, 223, 0.75);
        }

        .lang-toggle button.active {
            color: rgba(232, 228, 223, 0.88);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="c" aria-hidden="true"></canvas>

    <main class="center">
        <div class="line" aria-hidden="true"></div>
        <blockquote id="quote">Il n’y a que le chemin qui est réel.</blockquote>
        <div class="dot" aria-hidden="true"></div>
        <p class="thread"><a href="https://hunkaar.fr" rel="me">↔ hunkaar.fr</a></p>
    </main>

    <nav class="lang-toggle" aria-label="Langue" aria-hidden="true">
        <button type="button" id="btn-fr" class="active" onclick="setLang('fr')">fr</button>
        <span>·</span>
        <button type="button" id="btn-en" onclick="setLang('en')">en</button>
    </nav>

    <script>
        const texts = {
            fr: "Il n\u2019y a que le chemin qui est r\u00e9el.",
            en: "Only the path is real."
        };
        let current = 'fr';
        const quote = document.getElementById('quote');
        const btnFr = document.getElementById('btn-fr');
        const btnEn = document.getElementById('btn-en');

        function setLang(lang) {
            if (lang === current) return;
            current = lang;
            document.documentElement.lang = lang;

            btnFr.classList.toggle('active', lang === 'fr');
            btnEn.classList.toggle('active', lang === 'en');

            quote.classList.add('switching');
            quote.style.opacity = '0';
            quote.style.transform = 'translateY(8px)';

            setTimeout(() => {
                quote.textContent = texts[lang];
                quote.style.opacity = '1';
                quote.style.transform = 'translateY(0)';
            }, 400);
        }

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h, particles;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            const count = Math.floor((w * h) / 28000);
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.1 + 0.3,
                dx: (Math.random() - 0.5) * 0.12,
                dy: (Math.random() - 0.5) * 0.12,
                alpha: Math.random() * 0.25 + 0.05,
                phase: Math.random() * Math.PI * 2
            }));
        }

        function draw(t) {
            ctx.clearRect(0, 0, w, h);
            for (const p of particles) {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                const flicker = p.alpha + Math.sin(t * 0.0008 + p.phase) * 0.04;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(210, 195, 175, ${Math.max(0.02, flicker)})`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        init();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
